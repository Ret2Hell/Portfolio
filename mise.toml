[tools]
bun = "latest"
hk = "latest"
oxfmt = "latest"
oxlint = "latest"

[settings]
jobs = 4
lockfile = true

[tasks.install]
description = "Install dependencies with Bun"
run = "bun install --frozen-lockfile"
alias = ["i"]

[tasks.hooks]
description = "Install hk Git hooks"
run = "hk install --mise"
alias = ["hook"]

[tasks.dev]
description = "Start the Vite development server (Bun runtime)"
run = "bunx vite"
alias = ["d"]

[tasks.build]
description = "Build the Vite application"
run = "bunx vite build"
alias = ["b"]

[tasks.start]
description = "Preview the production Vite build (Bun runtime)"
depends = ["build"]
run = "bunx vite preview"
alias = ["s"]

[tasks.lint]
description = "Lint the project with Oxlint"
run = "oxlint ."
alias = ["l"]

[tasks.format]
description = "Format the project with Oxfmt"
run = "oxfmt --write ."
alias = ["f"]

[tasks.typecheck]
description = "Run the native TypeScript 7 compiler (tsc) without emitting files"
run = "bunx tsc --noEmit"
alias = ["t", "tc"]

[tasks.check]
description = "Run all validation checks"
depends = ["lint", "typecheck", "build"]
alias = ["c"]
